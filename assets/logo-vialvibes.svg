<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" role="img" aria-label="VialVibes">
  <defs>
    <linearGradient id="wordGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFAA"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <linearGradient id="mStroke" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFAA"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <linearGradient id="mFill" x1="50%" y1="20%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00FFAA" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="g" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Monogram -->
  <g transform="translate(2,4) scale(0.9)" filter="url(#g)">
    <rect x="46" y="14" width="28" height="7" rx="2" fill="none" stroke="url(#mStroke)" stroke-width="2.2"/>
    <rect x="50" y="21" width="20" height="4" rx="1" fill="none" stroke="url(#mStroke)" stroke-width="1.6"/>
    <path d="M54 25 v8 M66 25 v8" stroke="url(#mStroke)" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M42 36 C42 36 38 42 38 54 L38 82 C38 90 46 96 60 96 C74 96 82 90 82 82 L82 54 C82 42 78 36 78 36 Z"
          fill="url(#mFill)" stroke="url(#mStroke)" stroke-width="2.4" stroke-linejoin="round"/>
    <circle cx="44" cy="48" r="1.8" fill="#00FFAA"/>
    <circle cx="41" cy="60" r="1.6" fill="#00E5FF"/>
    <circle cx="43" cy="72" r="1.7" fill="#00FFAA"/>
    <path d="M44 48 L41 60 L43 72" fill="none" stroke="url(#mStroke)" stroke-width="1" opacity="0.5"/>
    <path d="M46 62 C50 52 54 72 58 62 S66 52 70 62 S78 72 80 64" fill="none" stroke="url(#mStroke)" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <!-- Wordmark: VIAL VIBES -->
  <g font-family="Space Grotesk, Inter, system-ui, sans-serif" font-weight="700" letter-spacing="0.04em">
    <text x="100" y="32" font-size="18" fill="#F8F9FA">VIAL</text>
    <text x="100" y="54" font-size="18" fill="url(#wordGrad)">VIBES</text>
