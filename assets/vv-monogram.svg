<?xml version="1.0" encoding="UTF-8"?>
<!-- VialVibes monogram: vial silhouette + vibe wave + chain suggestion. Gradient mint→cyan. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="VialVibes monogram">
  <defs>
    <linearGradient id="vvStroke" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFAA"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <linearGradient id="vvFill" x1="50%" y1="30%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00FFAA" stop-opacity="0.45"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Soft ambient glow disc -->
  <circle cx="60" cy="62" r="42" fill="#00E5FF" opacity="0.06"/>
  <g filter="url(#softGlow)" transform="translate(0,2)">
    <!-- Cap -->
    <rect x="46" y="14" width="28" height="8" rx="2.5" fill="none" stroke="url(#vvStroke)" stroke-width="2.4"/>
    <rect x="50" y="22" width="20" height="5" rx="1.5" fill="none" stroke="url(#vvStroke)" stroke-width="1.8" opacity="0.85"/>
    <!-- Neck -->
    <path d="M54 27 v10" stroke="url(#vvStroke)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <path d="M66 27 v10" stroke="url(#vvStroke)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <!-- Vial body silhouette -->
    <path d="M42 40
             C42 40 38 46 38 58
             L38 88
             C38 96 46 102 60 102
             C74 102 82 96 82 88
             L82 58
             C82 46 78 40 78 40
             Z"
          fill="url(#vvFill)"
          stroke="url(#vvStroke)"
          stroke-width="2.6"
          stroke-linejoin="round"/>
    <!-- Amino-acid chain suggestion (subtle nodes along left curve) -->
    <circle cx="44" cy="52" r="2.2" fill="#00FFAA"/>
    <circle cx="41" cy="64" r="2" fill="#00E5FF"/>
    <circle cx="42" cy="76" r="2.2" fill="#00FFAA"/>
    <circle cx="46" cy="88" r="1.8" fill="#00E5FF"/>
    <path d="M44 52 L41 64 L42 76 L46 88" fill="none" stroke="url(#vvStroke)" stroke-width="1.2" opacity="0.55"/>
    <!-- Frequency / vibe wave (alive) -->
    <path d="M46 68
             C50 58, 54 78, 58 68
             S66 58, 70 68
             S78 78, 80 70"
          fill="none"
          stroke="url(#vvStroke)"
          stroke-width="2.8"
          stroke-linecap="round"
          stroke-linejoin="round"/>
    <!-- Secondary softer wave -->
    <path d="M48 76
             C52 70, 56 82, 60 76
             S68 70, 74 76"
          fill="none"
          stroke="#00E5FF"
          stroke-width="1.4"
          stroke-linecap="round"
          opacity="0.55"/>
  </g>
</svg>
