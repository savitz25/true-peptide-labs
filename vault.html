  <script src="js/email-client.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      if (params.get('lot')) document.getElementById('lot').value = params.get('lot');
      if (params.get('product')) document.getElementById('product').value = params.get('product');

      document.getElementById('vault-form').addEventListener('submit', async function (e) {
        e.preventDefault();
        var lot = document.getElementById('lot').value.trim();
        var product = document.getElementById('product').value.trim();
        var email = document.getElementById('email').value.trim();
        if (!lot) return;

        var lock = document.getElementById('vault-lock');
        var submitBtn = e.target.querySelector('button[type="submit"]');
        if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = 'Unlocking…'; }

        try {
          if (window.VVEmail) {
            await VVEmail.sendVaultRequest({ lot: lot, product: product, email: email, source: 'vault' });
          }
        } catch (err) {
          // Still show local verified UI; surface error if API fails
          var errEl = document.getElementById('vault-api-error');
          if (!errEl) {
            errEl = document.createElement('p');
            errEl.id = 'vault-api-error';
            errEl.className = 'text-sm mt-3 text-center';
            errEl.style.color = '#f87171';
            e.target.appendChild(errEl);
          }
          errEl.textContent = (err && err.message) ? err.message : 'Could not send request. Email research@vialvibes.com with your lot number.';
          if (submitBtn) { submitBtn.disabled = false; submitBtn.innerHTML = '<i class="fa-solid fa-key"></i> Unlock documentation request'; }
          return;
        }

        lock.classList.add('unlocked');
        lock.innerHTML = '<i class="fa-solid fa-lock-open"></i>';
        document.getElementById('lot-out').textContent = lot;
        document.getElementById('vault-ok').classList.add('show');
        document.getElementById('vault-form').style.opacity = '0.45';
        document.getElementById('vault-form').style.pointerEvents = 'none';

        var subject = encodeURIComponent('CoA request — lot ' + lot);
        var body = encodeURIComponent(
          'Lot number: ' + lot + '\n' +
          'Product: ' + (product || '(not specified)') + '\n' +
          'Researcher email: ' + (email || '(not specified)') + '\n\n' +
          'Please provide Certificate of Analysis documentation if available for this research lot.\n'
        );
        var ml = document.getElementById('mailto-link');
        if (ml) ml.href = 'mailto:research@vialvibes.com?subject=' + subject + '&body=' + body;

        try {
          var log = JSON.parse(localStorage.getItem('vv_vault_requests') || '[]');
          log.unshift({ lot: lot, product: product, email: email, at: new Date().toISOString() });
          localStorage.setItem('vv_vault_requests', JSON.stringify(log.slice(0, 20)));
        } catch (err2) {}
      });
    })();
  </script>
